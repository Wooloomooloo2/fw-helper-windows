name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src -c Release -warnaserror

      - name: Test
        run: dotnet test tests/FwHelper.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FwHelper-win-x64
          path: publish/FwHelper.exe
